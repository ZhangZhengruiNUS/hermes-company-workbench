/* ---------- projects: 只认 task.project_id, 统一 projStats 口径 ---------- */
function projStatBadges(s){
  var parts=[];
  if(s.todo)parts.push('<span class="badge"><span class="dot" style="background:var(--text-3)"></span>待办 '+s.todo+'</span>');
  if(s.ready)parts.push('<span class="badge"><span class="dot" style="background:var(--accent)"></span>就绪 '+s.ready+'</span>');
  if(s.running)parts.push('<span class="badge b-todo"><span class="dot"></span>进行中 '+s.running+'</span>');
  if(s.blocked)parts.push('<span class="badge b-blocked"><span class="dot"></span>阻塞 '+s.blocked+'</span>');
  if(s.done)parts.push('<span class="badge b-done"><span class="dot"></span>完成 '+s.done+'</span>');
  if(s.archived)parts.push('<span class="badge"><span class="dot" style="background:var(--text-3)"></span>归档 '+s.archived+'</span>');
  return parts.join('');
}
function projLatestHtml(s,pid){
  var e=taskLatestEvent(pid);
  if(!e)return '<span style="color:var(--text-3)">最近活动: —</span>';
  return '<span>最近活动: '+esc(e.kind)+' · '+esc((e.title||"").slice(0,22))+' '+fmtTs(e.created_at)+'</span>';
}
function renderProjects(){
  var el=document.getElementById("projCards");
  if(D.projectsOk===false){
    // 数据源故障如实呈现, 不伪装成"无项目"
    el.innerHTML='<div class="empty" style="color:var(--st-blocked)">⚠ 项目数据源不可用'+(D.projectsError?(' · '+esc(D.projectsError)):'')+'</div>';
    return;
  }
  if(!(D.projects||[]).length){el.innerHTML='<div class="empty">暂无项目</div>';return;}
  el.innerHTML=D.projects.map(function(p){
    var s=projStats(p.id);
    if(!s.total){
      return '<div class="pcard"><div class="ph"><span class="pname">'+esc(p.name)+'</span></div>'+
        '<div class="pdesc">'+esc(p.desc||"")+'</div>'+
        '<div class="pmeta"><span style="color:var(--text-3)">暂无任务</span></div>'+
        '<button class="pfilter" data-proj="'+esc(p.id)+'">查看本项目任务 →</button></div>';
    }
    var pct=s.rate==null?0:s.rate;
    var rateTxt=s.rate==null?"—":s.rate+"%";
    var act=s.activeTasks[0];
    // 进度文案自然化: 不直接显示 100%(done/未归档N), 公式放 title 提示
    var activeTotal=s.total-s.archived;
    var progMeta;
    if(s.done>0&&s.done===activeTotal&&activeTotal>0){
      progMeta='<span title="公式: 完成 '+s.done+' / 未归档 '+activeTotal+'">关联任务已全部完成'+(s.archived?' · 历史归档 '+s.archived+' 项':'')+'</span>';
    }else{
      progMeta='<span title="公式: 完成 '+s.done+' / 未归档 '+activeTotal+'">当前任务: '+s.done+'/'+activeTotal+' 已完成'+(s.archived?'\n历史归档: '+s.archived+' 项':'')+'</span>';
    }
    return '<div class="pcard"><div class="ph"><span class="pname">'+esc(p.name)+'</span>'+
      '<span class="badge"><span class="dot"></span>共 '+s.total+' 个任务</span>'+
      (s.blocked?'<span class="badge b-blocked"><span class="dot"></span>阻塞 '+s.blocked+'</span>':'')+'</div>'+
      '<div class="pdesc">'+esc(p.desc||"")+'</div>'+
      '<div class="pstat" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">'+projStatBadges(s)+'</div>'+
      '<div class="prog"><i style="width:'+pct+'%"></i></div>'+
      '<div class="pmeta" style="white-space:pre-line">'+progMeta+'</div>'+
      '<div class="pmeta">'+projLatestHtml(s,p.id)+
      '<span>'+(act?("当前: "+esc(act.title.slice(0,30))):"无进行中任务")+'</span></div>'+
      '<button class="pfilter" data-proj="'+esc(p.id)+'">查看本项目任务 →</button></div>';
  }).join("");
  el.querySelectorAll(".pfilter").forEach(function(b){
    b.addEventListener("click",function(){
      F.project=b.getAttribute("data-proj");fselP.value=F.project;
      showView("tasks");renderTasks();syncClear();
    });
  });
}

/* ---------- activity: 真实 task_events 事件流 (最新优先; 加载更多=向后端取历史) ---------- */
var actShown=0;
var actHistoryBusy=false, actHistoryDone=false;
function actEventRow(e){
  return liveEventHtml(e);
}
function renderActivity(reset){
  var wrap=document.getElementById("actList");
  if(reset){actShown=0;wrap.innerHTML="";actHistoryDone=false;
    var m=document.getElementById("actMore");m.hidden=true;}
  if(ACT_EVENTS.length){
    var page=ACT_EVENTS.slice(actShown,actShown+ACT_PAGE);
    wrap.insertAdjacentHTML("beforeend",page.map(actEventRow).join(""));
    actShown+=page.length;
    var more=document.getElementById("actMore");
    var localRemain=ACT_EVENTS.length-actShown;
    if(localRemain>0){
      more.hidden=false;
      more.textContent="加载更多("+(localRemain)+" 条)";
    }else{
      // 本地已取完: 历史再向前分页(真正向后端取更旧事件)
      more.hidden=actHistoryDone;
      if(!actHistoryDone)more.textContent="加载更早的历史…";
    }
    return;
  }
  // ACT_EVENTS 空(启动拉取失败/API 离线): 如实提示
  wrap.innerHTML='<div class="empty">事件数据不可达(API 离线)</div>';
}
document.getElementById("actMore").addEventListener("click",function(){
  var localRemain=ACT_EVENTS.length-actShown;
  if(localRemain>0){renderActivity(false);return;}
  if(actHistoryBusy||actHistoryDone)return;
  actHistoryBusy=true;
  var oldest=ACT_EVENTS.length?ACT_EVENTS[ACT_EVENTS.length-1].id:0;
  fetchJSON("/api/v1/events?order=desc&before="+oldest).then(function(r){
    actHistoryBusy=false;
    if(!(r.json&&r.json.ok))return;
    var evs=(r.json.data.events||[]).slice().sort(function(a,b){return b.id-a.id;});
    if(!evs.length){
      actHistoryDone=true;document.getElementById("actMore").hidden=true;
      return;
    }
    // 每次只展示一页(不足 ACT_PAGE 的尾页全部展示), 已显示内容不动
    prependActivities(evs,{history:true});
    var newShown=Math.min(evs.length,ACT_PAGE);
    if(currentView==="activity"){
      var wrap=document.getElementById("actList");
      var page=ACT_EVENTS.slice(actShown,actShown+newShown);
      wrap.insertAdjacentHTML("beforeend",page.map(actEventRow).join(""));
      actShown+=page.length;
    }
    // 隐藏条件: 本地已全部展示 且 后端 has_more=false
    if(!r.json.data.has_more){
      actHistoryDone=true;
      document.getElementById("actMore").hidden=true;
    }else{
      var more=document.getElementById("actMore");
      more.hidden=false;
      more.textContent="加载更早的历史…";
    }
  }).catch(function(){actHistoryBusy=false;});
});

/* 初始渲染由启动流程 bootRender() 负责(数据到达后), 此处不再用空数据渲染 */
